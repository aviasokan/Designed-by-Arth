<!doctype html>
<html><head><meta charset="utf-8"><title>Diwali Poster Animation</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="2000"></canvas>
<script>
// ---- Deterministic, seamlessly-looping animation: everything is a pure function of time t (0..T) ----
const T = 10;                       // loop length in seconds
const W = 1600, H = 2000;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
function hash(n){ n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
const mod = (a, b) => ((a % b) + b) % b;
const cyc = (t, n, ph = 0) => 0.5 + 0.5 * Math.sin(TAU * (n * t / T + ph));  // n whole cycles per loop -> seamless

let base, lights = [], ready = false;
const glowCache = {};
function glowSprite(r, g, b){
  const k = r + ',' + g + ',' + b;
  if (glowCache[k]) return glowCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(255,255,255,1)`);
  gr.addColorStop(0.12, `rgba(${r},${g},${b},0.95)`);
  gr.addColorStop(0.4, `rgba(${r},${g},${b},0.25)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return glowCache[k] = c;
}
function glow(x, y, rad, a, col = [255, 190, 90]){
  if (a <= 0.01) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(glowSprite(...col), x - rad, y - rad, rad * 2, rad * 2);
}
function star4(x, y, s, a, col = '255,200,90'){
  if (a <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = Math.min(1, a);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, `rgba(${col},0.9)`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * .06, -s * .06, s, 0); ctx.quadraticCurveTo(s * .06, s * .06, 0, s);
  ctx.quadraticCurveTo(-s * .06, s * .06, -s, 0); ctx.quadraticCurveTo(-s * .06, -s * .06, 0, -s); ctx.fill();
  ctx.restore();
}

// ---------------- scene elements ----------------
// 1) twinkling string lights on the house (chasing wave + random flicker)
function drawHouseLights(t){
  lights.forEach(([x, y], i) => {
    const wave = 0.5 + 0.5 * Math.sin(TAU * (2 * t / T) - (x + y * .3) * 0.012);       // chase along the roofline
    const tw = cyc(t, 2 + Math.floor(hash(i) * 4), hash(i + 9));                          // individual twinkle
    const a = 0.25 + 0.75 * (0.55 * wave + 0.45 * tw);
    const warm = hash(i + 3) > .8 ? [255, 160, 60] : [255, 205, 110];
    glow(x, y, 13 + 7 * a, a * 0.85, warm);
    glow(x, y, 4 + 3 * a, a, [255, 245, 220]);
  });
}

// 2) sky fireworks (new bursts) + pulsing/sparkle on the baked-in ones
const BURSTS = [
  // x, y, radius, start(s), hue-colour, count
  [205, 505, 150, 0.4, [255, 170, 60]],
  [1425, 470, 160, 1.6, [200, 90, 255]],
  [330, 300, 120, 3.2, [255, 90, 160]],
  [1490, 330, 130, 4.4, [255, 190, 70]],
  [150, 330, 115, 5.8, [120, 200, 255]],
  [1360, 560, 120, 6.9, [255, 120, 90]],
  [260, 560, 110, 8.0, [255, 220, 120]],
  [1450, 140, 110, 9.0, [160, 255, 170]],
];
const BDUR = 2.4;
function drawBursts(t){
  BURSTS.forEach(([cx, cy, R, st, col], bi) => {
    const age = mod(t - st, T);
    if (age > BDUR) return;
    const u = age / BDUR;
    const n = 70;
    for (let i = 0; i < n; i++){
      const ang = TAU * (i / n) + hash(bi * 100 + i) * .3;
      const sp = R * (0.55 + 0.45 * hash(bi * 300 + i + 1));
      const ease = 1 - Math.pow(1 - Math.min(1, u * 1.15), 3);
      const gravity = 60 * u * u;
      const x = cx + Math.cos(ang) * sp * ease, y = cy + Math.sin(ang) * sp * ease + gravity;
      const fade = Math.max(0, 1 - Math.pow(u, 1.6));
      const flick = 0.6 + 0.4 * Math.sin(age * 40 + i * 7);
      // trail
      const e2 = 1 - Math.pow(1 - Math.max(0, u * 1.15 - 0.07), 3);
      const x2 = cx + Math.cos(ang) * sp * e2, y2 = cy + Math.sin(ang) * sp * e2 + 60 * Math.max(0, u - .03) ** 2;
      ctx.globalAlpha = fade * 0.55; ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x, y); ctx.stroke();
      glow(x, y, 9, fade * flick, col);
    }
    // central flash
    glow(cx, cy, 120 * Math.max(0, 1 - u * 5), Math.max(0, 1 - u * 5), col);
  });
}
const FIREWORKS_BAKED = [[100, 115], [222, 165], [1430, 175], [1330, 245]];
function drawBakedPulse(t){
  FIREWORKS_BAKED.forEach(([x, y], i) => {
    glow(x, y, 120 + 20 * cyc(t, 2, i * .25), 0.28 + 0.2 * cyc(t, 2, i * .25 + .5), i % 2 ? [190, 90, 255] : [255, 160, 50]);
    for (let k = 0; k < 7; k++){
      const ang = TAU * hash(i * 20 + k), r = 40 + 80 * hash(i * 31 + k);
      const a = Math.pow(cyc(t, 3, hash(i * 7 + k)), 6);
      glow(x + Math.cos(ang) * r, y + Math.sin(ang) * r, 14, a, [255, 220, 150]);
    }
  });
}

// 3) cold-fountain sparks (left & right)
function drawFountain(t, bx, by){
  const L = 1.0, n = 130;
  for (let i = 0; i < n; i++){
    const age = mod(t - (i / n) * L, L);          // 0..1 life
    const h = hash(i * 3 + bx);
    const vx = (hash(i * 5 + bx + 1) - .5) * 260, vy = 520 + 380 * h;
    const x = bx + vx * age * 0.55, y = by - vy * age + 640 * age * age * 0.62;
    const a = (1 - age) * (0.55 + 0.45 * Math.sin(age * 30 + i));
    glow(x, y, 7 + 5 * (1 - age), a, [255, 215, 140]);
  }
  glow(bx, by - 20, 60 + 10 * cyc(t, 20), 0.7, [255, 190, 90]);
  glow(bx, by - 150, 90, 0.18 + 0.1 * cyc(t, 12), [255, 200, 110]);
}

// 4) sparklers (two bright tips with radiating sparks)
function drawSparkler(t, sx, sy, seed){
  const L = 0.5, n = 70;
  for (let i = 0; i < n; i++){
    const age = mod(t - (i / n) * L * 2, L) / L;
    const ang = TAU * hash(seed + i);
    const sp = 90 + 130 * hash(seed + i + 50);
    const x = sx + Math.cos(ang) * sp * age, y = sy + Math.sin(ang) * sp * age + 40 * age * age;
    const a = (1 - age) * (0.5 + 0.5 * Math.sin(age * 50 + i));
    ctx.globalAlpha = a * .8; ctx.strokeStyle = 'rgb(255,235,180)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(ang) * 14 * (1 - age), y - Math.sin(ang) * 14 * (1 - age)); ctx.stroke();
    glow(x, y, 6, a, [255, 220, 140]);
  }
  const fl = 0.75 + 0.25 * Math.sin(TAU * (25 * t / T + seed));
  glow(sx, sy, 70 * fl, 0.9, [255, 200, 110]);
  glow(sx, sy, 26 * fl, 1, [255, 255, 255]);
  star4(sx, sy, 60 * fl, 0.9, '255,230,170');
}

// 5) diyas: flickering flame + warm glow
const DIYAS = [[318, 1843, 1], [523, 1862, 1], [1033, 1862, 1], [1282, 1850, 1], [783, 1788, 1.5], [858, 1838, .9], [710, 1838, .9]];
function drawDiyas(t){
  DIYAS.forEach(([x, y, s], i) => {
    const f = 0.7 + 0.3 * Math.sin(TAU * (7 * t / T + hash(i))) * Math.sin(TAU * (11 * t / T + hash(i + 4)));
    const sway = Math.sin(TAU * (5 * t / T + hash(i + 8))) * 2.5 * s;
    glow(x, y, 85 * s * (0.9 + 0.2 * f), 0.5 * f, [255, 150, 50]);
    ctx.save(); ctx.translate(x + sway, y); ctx.globalAlpha = 0.95;
    const g = ctx.createRadialGradient(0, 4 * s, 0, 0, 0, 22 * s * f);
    g.addColorStop(0, 'rgba(255,255,230,1)'); g.addColorStop(.35, 'rgba(255,200,80,.95)'); g.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -2 * s, 9 * s, 20 * s * f, 0, 0, TAU); ctx.fill();
    ctx.restore();
  });
}

// 6) twinkling gold stars + floating embers
const STARS = [[127, 340, 16], [283, 440, 22], [104, 485, 14], [15, 555, 20], [140, 638, 18], [1526, 440, 14], [1370, 543, 22], [1548, 586, 16], [1513, 740, 18],
               [60, 230, 12], [1560, 260, 12], [420, 330, 10], [1190, 330, 10], [430, 700, 10], [1180, 560, 10]];
function drawStars(t){
  STARS.forEach(([x, y, s], i) => {
    const a = Math.pow(cyc(t, 2 + (i % 3), hash(i)), 1.5);
    const sz = s * (1 + 1.3 * a);
    star4(x, y, sz, 0.35 + 0.65 * a);
    glow(x, y, sz * 1.3, 0.25 * a, [255, 200, 90]);
  });
}
function drawEmbers(t){
  const n = 55;
  for (let i = 0; i < n; i++){
    const life = T / (1 + Math.floor(hash(i + 1) * 2));         // 10s or 5s: loops cleanly
    const age = mod(t + hash(i + 2) * T, life) / life;
    const x = hash(i + 3) * W + Math.sin(TAU * (age * 2 + hash(i))) * 30;
    const y = 1900 - age * 1100 * (0.6 + 0.4 * hash(i + 4));
    const a = Math.sin(Math.PI * age) * (0.3 + 0.5 * hash(i + 5));
    glow(x, y, 5 + 5 * hash(i + 6), a, [255, 190, 90]);
  }
}

// 7) shimmer sweeps over the logo and the "Diwali" title
function sweep(t, box, tOff){
  const [x0, y0, x1, y1] = box;
  const p = mod(t / T * 1 + tOff, 1);                          // one pass per loop
  const q = (p - .5) * 1.6;                                    // idle for part of the loop
  if (p > 0.45) return;
  const u = p / 0.45, cx = x0 + (x1 - x0 + 200) * u - 100, w = 90;
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,240,200,0.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, -0.35, 1, 0.35 * (y0 + y1) / 2, 0);   // skew the band
  ctx.fillRect(x0 - 200, y0, x1 - x0 + 400, y1 - y0);
  ctx.restore();
}

// -------------- master render --------------
function render(t){
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  // gentle "breathing" push-in, seamless loop
  const z = 1 + 0.018 * (0.5 - 0.5 * Math.cos(TAU * t / T));
  ctx.translate(W / 2, H * 0.55); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.55);
  ctx.drawImage(base, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  drawStars(t); drawBakedPulse(t); drawBursts(t);
  drawHouseLights(t);
  drawFountain(t, 98, 1640); drawFountain(t, 1520, 1640);
  drawDiyas(t);
  drawSparkler(t, 838, 1610, 11); drawSparkler(t, 935, 1580, 77);
  drawEmbers(t);
  sweep(t, [470, 330, 1135, 575], 0.0);   // "Diwali"
  sweep(t, [740, 30, 870, 165], 0.5);     // logo mark
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
window.render = render; window.T = T;
Promise.all([
  new Promise(r => { base = new Image(); base.onload = r; base.src = 'poster.jpg'; }),
  fetch('lights.json').then(r => r.json()).then(j => lights = j)
]).then(() => { ready = true; window.ready = true; render(0);
  if (!window.__capture){ const t0 = performance.now(); (function loop(){ render(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })(); } });
</script></body></html>
