<!doctype html>
<html><head><meta charset="utf-8"><title>Diwali Film</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="2000"></canvas>
<script>
// =====================================================================================
//  Diwali greeting film. Pure function of time: render(t). Story (seconds):
//   0.0  fade up on the dark house         0.7-2.9  window shutters slide open one by one
//   2.6-4.2 wall switch appears + flips ON  3.6-5.4  lights ignite in a wave, house warms up
//   4.2  logo pops in                       4.8-7.7  mandala draws, HAPPY slides in, Diwali letters drop
//   6.6  tagline wipes in, footer slides up 6.0-15   rocket fireworks, lanterns, light shows, glints
// =====================================================================================
const T = 16, W = 1600, TAU = Math.PI * 2;
const F916 = new URLSearchParams(location.search).get('fmt') === '916';
const OY = F916 ? 372 : 0, H = F916 ? 2844 : 2000;
const cv = document.getElementById('c'); cv.height = H; const ctx = cv.getContext('2d');
function hash(n){ n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
const mod = (a, b) => ((a % b) + b) % b;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const cyc = (t, n, ph = 0) => 0.5 + 0.5 * Math.sin(TAU * (n * t / T + ph));
const mix3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const easeOutBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutBounce = x => { x = clamp(x); const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x; if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + .75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + .9375; return n1 * (x -= 2.625 / d1) * x + .984375; };

let base, lights = [], LAY = {}, META = null;
const cache = {};
function sprite(col){
  const r = Math.round(col[0]), g = Math.round(col[1]), b = Math.round(col[2]), k = r + ',' + g + ',' + b;
  if (cache[k]) return cache[k];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.12, `rgba(${r},${g},${b},0.95)`);
  gr.addColorStop(0.4, `rgba(${r},${g},${b},0.25)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return cache[k] = c;
}
function glow(x, y, rad, a, col = [255, 190, 90]){
  if (a <= 0.01 || rad <= 0.5) return;
  ctx.globalAlpha = Math.min(1, a); ctx.drawImage(sprite(col), x - rad, y - rad, rad * 2, rad * 2);
}
function star4(x, y, s, a, col = '255,200,90'){
  if (a <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = Math.min(1, a);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, `rgba(${col},0.9)`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * .06, -s * .06, s, 0); ctx.quadraticCurveTo(s * .06, s * .06, 0, s);
  ctx.quadraticCurveTo(-s * .06, s * .06, -s, 0); ctx.quadraticCurveTo(-s * .06, -s * .06, 0, -s); ctx.fill();
  ctx.restore();
}
function drawSprite(s, dx = 0, dy = 0, sc = 1, rot = 0, alpha = 1){
  if (alpha <= 0.003 || sc <= 0.001) return;
  ctx.save(); ctx.globalAlpha = clamp(alpha); ctx.translate(s.x + s.w / 2 + dx, s.y + s.h / 2 + dy);
  ctx.rotate(rot); ctx.scale(sc, sc); ctx.drawImage(s.img, -s.w / 2, -s.h / 2, s.w, s.h); ctx.restore();
}
function rrect(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------------- timeline constants ----------------
const T_WIN = 0.7, T_SWITCH = 2.6, T_FLIP = 3.55, T_LIGHTS = 3.6, T_LOGO = 4.2, T_MAND = 4.8, T_HAPPY = 5.15, T_DIWALI = 5.6, T_TAG = 6.6, T_FOOT = 6.8, T_SHOW = 6.0;

// ============ 1. WINDOW SHUTTERS (slide open, revealing the lit rooms) ============
const WINDOWS = [[300, 905, 152, 145], [163, 1040, 72, 78], [588, 985, 125, 50], [1003, 937, 52, 50], [1086, 957, 48, 45],
                 [1248, 912, 92, 118], [605, 1155, 85, 105], [500, 1148, 52, 85], [875, 1160, 55, 24], [1100, 1162, 46, 30]];
function winProgress(t, k){ return ss((t - (T_WIN + k * 0.16)) / 0.75); }
function drawShutters(t){
  WINDOWS.forEach(([x, y, w, h], k) => {
    const p = winProgress(t, k); if (p >= 1) return;
    ctx.save(); ctx.beginPath(); ctx.rect(x - 1, y - 1, w + 2, h + 2); ctx.clip();
    if (p > 0){                                    // the lit room, at full brightness, in the gap
      ctx.drawImage(base, 0, -OY, W, H);
    }
    const half = w / 2, off = half * p;
    [[x - off, 1], [x + half + off, -1]].forEach(([px, dir]) => {          // two sliding panels
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, '#1a1f3d'); g.addColorStop(1, '#0d1128');
      ctx.fillStyle = g; ctx.fillRect(px, y, half + 1, h);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let yy = y + 5; yy < y + h; yy += 7) ctx.fillRect(px, yy, half + 1, 2);       // slats
      ctx.fillStyle = 'rgba(160,180,255,.28)'; ctx.fillRect(dir > 0 ? px + half - 2 : px, y, 2, h);                        // leading edge
    });
    ctx.restore();
  });
}
function drawWindowSpill(t){
  WINDOWS.forEach(([x, y, w, h], k) => {
    const p = winProgress(t, k), pulse = Math.exp(-Math.pow((t - (T_WIN + k * 0.16 + 0.4)) / 0.3, 2));
    glow(x + w / 2, y + h / 2, Math.max(w, h) * 1.25, p * 0.4 + pulse * 0.5, [255, 200, 120]);
  });
}

// ============ 2. THE SWITCH ============
function drawSwitch(t){
  const aIn = ss((t - T_SWITCH) / 0.45), aOut = 1 - ss((t - 3.95) / 0.35), A = aIn * aOut; if (A <= 0.01) return;
  const grow = lerp(0.55, 1, easeOutBack((t - T_SWITCH) / 0.5)) * (1 + 0.3 * ss((t - 3.95) / 0.35));
  const s = easeOutBack((t - T_FLIP) / 0.16);                              // 0 = off, 1 = on
  const wob = (t > 3.15 && t < T_FLIP) ? Math.sin((t - 3.15) * 60) * 0.02 * (1 - (t - 3.15) / 0.4) : 0;   // anticipation
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(800, OY + 1000); ctx.scale(grow, grow); ctx.rotate(wob); ctx.globalAlpha = A;
  const on = clamp(s);
  // glow behind plate
  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(0, 0, 40, 0, 0, 460);
  gg.addColorStop(0, `rgba(255,190,80,${0.15 + 0.55 * on})`); gg.addColorStop(1, 'rgba(255,190,80,0)');
  ctx.fillStyle = gg; ctx.fillRect(-500, -500, 1000, 1000);
  ctx.globalCompositeOperation = 'source-over';
  // plate
  const pg = ctx.createLinearGradient(-170, -250, 170, 250); pg.addColorStop(0, '#2c3150'); pg.addColorStop(1, '#10132a');
  rrect(-175, -255, 350, 510, 38); ctx.fillStyle = pg; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(150,165,220,.55)'; ctx.stroke();
  rrect(-125, -195, 250, 390, 26); ctx.fillStyle = '#080a1a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
  [[-140, -225], [140, -225], [-140, 225], [140, 225]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fillStyle = '#4a4f6e'; ctx.fill(); ctx.fillStyle = '#1a1d33'; ctx.fillRect(x - 6, y - 1.5, 12, 3); });
  // rocker: raised half is taller and brighter
  const ht = 160 * (0.82 + 0.36 * on), hb = 160 * (1.18 - 0.36 * on);
  const raised = ['#fbf6e6', '#d9d2bd'], sunk = ['#7b7868', '#5a5849'];
  const topC = on > .5 ? raised : sunk, botC = on > .5 ? sunk : raised;
  [[-ht, 0, topC], [0, hb, botC]].forEach(([y0, y1, c], i) => {
    const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, i ? c[1] : c[0]); g.addColorStop(1, i ? c[0] : c[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-92, y0, 184, y1 - y0, i ? [0, 0, 18, 18] : [18, 18, 0, 0]); ctx.fill();
  });
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-92, -2, 184, 4);
  // I / O marks
  ctx.lineCap = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = on > .5 ? '#ff9d1a' : '#8a8776';
  ctx.beginPath(); ctx.moveTo(0, -ht * 0.62); ctx.lineTo(0, -ht * 0.22); ctx.stroke();
  ctx.lineWidth = 9; ctx.strokeStyle = on > .5 ? '#6d6a5c' : '#9a8f6a'; ctx.beginPath(); ctx.arc(0, hb * 0.5, 24, 0, TAU); ctx.stroke();
  // LED
  ctx.beginPath(); ctx.arc(0, -228, 8, 0, TAU); ctx.fillStyle = on > .5 ? '#ffd66b' : '#5a1c1c'; ctx.fill();
  ctx.restore();
  // click ripples + screen flash
  const dt = t - T_FLIP - 0.06;
  if (dt > 0 && dt < 1.2){
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < 3; i++){ const d = dt - i * 0.12; if (d <= 0) continue;
      ctx.globalAlpha = Math.exp(-d * 3.5) * 0.9; ctx.strokeStyle = 'rgb(255,200,110)'; ctx.lineWidth = 8 - i * 2;
      ctx.beginPath(); ctx.arc(800, OY + 1000, 120 + d * 1100, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 0.34 * Math.exp(-dt * 8); ctx.fillStyle = 'rgb(255,215,150)'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// ============ 3. HOUSE LIGHTS: ignition wave, then changing patterns ============
const GOLD = [255, 205, 110], ORANGE = [255, 140, 50], PINK = [255, 90, 160], WHITE = [255, 240, 215], ROSE = [255, 120, 110];
const win = (t, a, b) => ss((t - a) / 0.5) * (1 - ss((t - b) / 0.5));
const glowWide = t => 0.10 + 0.07 * Math.sin(TAU * t * 0.5);
function drawHouseLights(t){
  const wC = win(t, 4.6, 7.9), wB = win(t, 7.6, 10.4), wT = win(t, 10.1, 12.9), wR = win(t, 12.6, 99), ws = (wC + wB + wT + wR) || 1;
  lights.forEach(([x, y], i) => {
    const ti = T_LIGHTS + (x / W) * 1.6 + hash(i) * 0.2;
    const on = ss((t - ti) / 0.12), flash = Math.exp(-Math.pow((t - ti - 0.05) / 0.14, 2));
    const aC = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(TAU * (t * 0.9) - (x + y * .3) * 0.018));
    const par = (i + Math.floor(t * 2.2)) % 3, aB = par === 0 ? 1 : 0.18;
    const aT = 0.15 + 0.85 * Math.pow(0.5 + 0.5 * Math.sin(TAU * (t * (0.8 + 1.6 * hash(i + 4)) + hash(i + 9))), 2);
    const aR = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(TAU * (t * 1.6) + (x * 0.012)));
    const a = (wC * aC + wB * aB + wT * aT + wR * aR) / ws, cB = [GOLD, ORANGE, PINK][(i + Math.floor(t * 2.2)) % 3];
    const k1 = ss(0.5 + 0.5 * Math.sin(TAU * t * 0.4 - x * 0.004)), k2 = ss(0.5 + 0.5 * Math.sin(TAU * t * 0.4 - x * 0.004 + 2));
    const cR = mix3(mix3(GOLD, ROSE, k1), PINK, k2), cT = hash(i + 3) > .8 ? ORANGE : GOLD;
    const col = [0, 1, 2].map(c => (wC * GOLD[c] + wB * cB[c] + wT * cT[c] + wR * cR[c]) / ws);
    const A = a * on;
    glow(x, y, 15 + 9 * A + 22 * flash, A * 0.9 + flash * .6, col);
    glow(x, y, 4 + 3 * A, Math.min(1, A + flash), WHITE);
    if (A > 0.75) glow(x, y, 34, (A - 0.75) * 0.5, col);
  });
  const k = ss((t - T_LIGHTS) / 1.5), g = ctx.createRadialGradient(790, 980, 20, 790, 980, 700);
  g.addColorStop(0, 'rgba(255,160,70,0.5)'); g.addColorStop(1, 'rgba(255,160,70,0)');
  ctx.fillStyle = g; ctx.globalAlpha = k * glowWide(t); ctx.fillRect(0, 600, W, 700);
}

// ============ 4. TITLE DESIGN: mandala, flourishes, letters ============
function drawMandala(t){
  const p = clamp((t - T_MAND) / 1.9); if (p <= 0) return;
  const rot = 0.14 * (t - T_MAND), AB = 0.9 * (1 - 0.5 * ss((t - 8.5) / 1.5));
  ctx.save(); ctx.translate(800, 452); ctx.scale(1, 0.8); ctx.lineCap = 'round';
  [[215, 0.0, [3, 9], 2.4], [262, 0.12, [14, 9], 3], [305, 0.24, [2, 13], 2.4]].forEach(([r, d, dash, lw], i) => {
    const q = ss((p - d) / (1 - d)); if (q <= 0) return;
    ctx.save(); ctx.rotate(rot * (i % 2 ? -1 : 1)); ctx.setLineDash(dash); ctx.lineWidth = lw;
    ctx.strokeStyle = 'rgb(255,205,100)'; ctx.globalAlpha = AB * q;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU * q); ctx.stroke(); ctx.restore();
  });
  for (let i = 0; i < 16; i++){
    const q = ss((p - 0.12 - i * 0.025) / 0.45); if (q <= 0) continue;
    const L = (i % 2 ? 80 : 108) * q, r0 = 118;
    ctx.save(); ctx.rotate(rot + i * TAU / 16);
    ctx.beginPath(); ctx.moveTo(0, -r0); ctx.quadraticCurveTo(32, -r0 - L * .55, 0, -r0 - L); ctx.quadraticCurveTo(-32, -r0 - L * .55, 0, -r0);
    ctx.globalAlpha = AB * q * 0.18; ctx.fillStyle = 'rgb(255,170,60)'; ctx.fill();
    ctx.globalAlpha = AB * q * 0.95; ctx.strokeStyle = 'rgb(255,205,110)'; ctx.lineWidth = 2.8; ctx.setLineDash([]); ctx.stroke();
    ctx.restore();
  }
  for (let i = 0; i < 36; i++){
    const q = ss((p - 0.3 - i * 0.012) / 0.3); if (q <= 0) continue;
    const a = rot * -1.4 + i * TAU / 36;
    glow(Math.cos(a) * 335, Math.sin(a) * 335, 9, AB * q * (0.5 + 0.5 * Math.sin(t * 5 + i)), [255, 190, 90]);
  }
  ctx.restore();
}
function drawFlourish(t){
  const p = ss((t - 6.35) / 0.9); if (p <= 0) return;
  [-1, 1].forEach(dir => {
    const x0 = 800 + dir * 345, len = 230 * p, y = 452;
    const g = ctx.createLinearGradient(x0, 0, x0 + dir * 230, 0); g.addColorStop(0, 'rgba(255,200,100,.95)'); g.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.globalAlpha = 0.85; ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x0 + dir * len), y - 1.5, len, 3);
    for (let i = 0; i < 6; i++){ const d = 40 + i * 34; if (d > len) break; glow(x0 + dir * d, y - 14 - (i % 2) * 6, 5, 0.7 * (1 - d / 260), [255, 200, 100]); glow(x0 + dir * d, y + 14 + (i % 2) * 6, 5, 0.7 * (1 - d / 260), [255, 200, 100]); }
    const ex = x0 + dir * len;                                                                             // diamond tip
    ctx.save(); ctx.translate(ex, y); ctx.rotate(Math.PI / 4); ctx.globalAlpha = 0.9 * p; ctx.fillStyle = 'rgb(255,210,120)'; ctx.fillRect(-7, -7, 14, 14); ctx.restore();
    glow(ex, y, 26, 0.8 * p, [255, 190, 80]);
  });
}
function easeLand(p){ return easeOutBounce(p); }
function drawTitle(t){
  // HAPPY: slides in from the sides, tracking closes up
  META.happy.forEach((l, i) => {
    const p = clamp((t - (T_HAPPY + i * 0.09)) / 0.6); if (p <= 0) return;
    const e = easeOutBack(p), cx = l.x + l.w / 2 - 810;
    drawSprite(LAY[l.name], cx * 0.9 * (1 - e), 0, lerp(1.35, 1, e), 0, Math.min(1, p * 3));
  });
  // Diwali: letters drop in with a bounce
  META.diwali.forEach((l, i) => {
    const st = T_DIWALI + i * 0.12, p = clamp((t - st) / 0.75); if (p <= 0) return;
    const e = easeLand(p), dir = i % 2 ? 1 : -1;
    drawSprite(LAY[l.name], 0, -150 * (1 - e), 1 + 0.9 * Math.pow(1 - p, 2), dir * 0.22 * (1 - e), Math.min(1, p * 4));
  });
}
function drawTitleOverlay(t){      // additive: landing flashes, shock rings, sparkle bursts
  META.diwali.forEach((l, i) => {
    const land = T_DIWALI + i * 0.12 + 0.75 * 0.38, d = t - land;       // first bounce contact
    const cx = l.x + l.w / 2, by = l.y + l.h;
    if (d > 0 && d < 0.9){
      const f = Math.exp(-d * 6);
      drawSpriteAdd(LAY[l.name], f * 0.9);
      glow(cx, by, 120 * (0.4 + d * 1.2), 0.7 * f, [255, 190, 80]);
      ctx.globalAlpha = 0.8 * Math.exp(-d * 4); ctx.strokeStyle = 'rgb(255,215,140)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, by, 30 + d * 340, (30 + d * 340) * 0.18, 0, 0, TAU); ctx.stroke();
      for (let k = 0; k < 8; k++){ const a = hash(i * 9 + k) * TAU, sp = 90 + 190 * hash(i * 5 + k + 3);
        glow(cx + Math.cos(a) * sp * d, by - Math.abs(Math.sin(a)) * sp * d + 260 * d * d, 8, f, [255, 215, 140]); }
      star4(cx, l.y + 20, 50 * f, f);
    }
  });
  META.happy.forEach((l, i) => {
    const d = t - (T_HAPPY + i * 0.09 + 0.45);
    if (d > 0 && d < 0.5) { drawSpriteAdd(LAY[l.name], Math.exp(-d * 8) * 0.9); star4(l.x + l.w / 2, l.y + l.h / 2, 38 * Math.exp(-d * 5), Math.exp(-d * 5)); }
  });
}
function drawSpriteAdd(s, a){ drawSprite(s, 0, 0, 1, 0, a); }

// ============ 5. LOGO + TAGLINE reveals ============
function wipeSprite(s, t, st, dur, rise = 18){
  const p = clamp((t - st) / dur); if (p <= 0) return;
  const e = ss(p), edge = s.x + s.w * e;
  ctx.save(); ctx.beginPath(); ctx.rect(s.x - 10, s.y - 40, (edge - s.x) + 10, s.h + 80); ctx.clip();
  drawSprite(s, 0, rise * (1 - e), 1, 0, 1); ctx.restore();
  if (p < 1){ ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(edge - 40, 0, edge + 40, 0); g.addColorStop(0, 'rgba(255,215,140,0)'); g.addColorStop(.5, 'rgba(255,235,190,.9)'); g.addColorStop(1, 'rgba(255,215,140,0)');
    ctx.fillStyle = g; ctx.globalAlpha = 0.65 * (1 - Math.abs(p - .5) * 1.4); ctx.fillRect(edge - 40, s.y - 6, 80, s.h + 12); ctx.restore(); }
}
function drawLogo(t){
  const m = LAY.logo_mark, p = clamp((t - T_LOGO) / 0.9); 
  if (p > 0){ const e = easeOutBack(p); drawSprite(m, 0, 0, lerp(0.2, 1, e), (1 - e) * -0.9, Math.min(1, p * 3)); }
  wipeSprite(LAY.logo_name, t, T_LOGO + 0.45, 0.85);
}
function drawLogoFX(t){
  const m = LAY.logo_mark, cx = m.x + m.w / 2, cy = m.y + m.h / 2, d = t - (T_LOGO + 0.35);
  if (d > 0 && d < 1.2){ const f = Math.exp(-d * 3.2);
    glow(cx, cy, 190 * (0.5 + d), 0.8 * f, [255, 190, 90]);
    ctx.globalAlpha = f; ctx.strokeStyle = 'rgb(255,210,130)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, 40 + d * 430, 0, TAU); ctx.stroke();
    for (let i = 0; i < 12; i++){ const a = i * TAU / 12; glow(cx + Math.cos(a) * (60 + d * 320), cy + Math.sin(a) * (60 + d * 320), 11, f, [255, 220, 150]); }
    star4(cx, cy, 130 * f, f);
    drawSpriteAdd(m, f * 0.8);
  }
}

// ============ 6. FIREWORKS (rocket launch -> burst) ============
const SHOWS = [
  [2.2, 210, 470, 150, 'peony',   [255, 170, 60]],  [2.9, 1400, 430, 160, 'ring',   [200, 100, 255]],
  [3.8, 300, 330, 115, 'willow',  [255, 200, 90]],  [4.6, 1480, 330, 125, 'peony',  [255, 90, 160]],
  [5.5, 150, 540, 125, 'heart',   [255, 70, 110]],  [6.3, 1340, 540, 135, 'double', [255, 210, 80], [255, 70, 70]],
  [7.2, 240, 420, 150, 'crackle', [255, 235, 170]], [8.0, 1450, 470, 150, 'peony',  [110, 200, 255]],
  [8.8, 130, 330, 115, 'ring',    [110, 255, 200]], [9.5, 1330, 330, 125, 'willow', [255, 190, 80]],
  [10.3, 250, 560, 135, 'double', [255, 120, 60], [255, 230, 120]], [11.0, 1470, 600, 130, 'heart', [255, 80, 170]],
  [11.8, 180, 430, 150, 'peony',  [190, 120, 255]], [12.5, 1400, 420, 170, 'peony', [255, 180, 70]],

  [13.6, 140, 350, 130, 'peony',  [120, 255, 170]],
];
SHOWS.forEach(s => s[0] = T_SHOW + (s[0] - 2.2) * 0.6);
if (F916){ [[1.9, 800, -170, 190, 'peony', [255, 190, 80], null, 1], [4.2, 380, -150, 150, 'ring', [255, 110, 190]],
  [5.2, 1230, -190, 150, 'double', [120, 210, 255], [255, 240, 160]], [7.0, 800, -150, 175, 'heart', [255, 80, 120], null, 1],
  [9.0, 1260, -120, 140, 'willow', [255, 200, 90]], [10.0, 330, -210, 140, 'crackle', [255, 235, 170]],
  [11.4, 800, -190, 200, 'ring', [190, 130, 255], null, 1], [12.7, 1200, -230, 150, 'peony', [255, 120, 80]],
  [13.0, 420, -120, 150, 'double', [110, 255, 190], [255, 210, 90]], [13.7, 800, -200, 210, 'peony', [255, 200, 90], null, 1]]
  .forEach(s => { s[0] = T_SHOW + (s[0] - 1.9) * 0.6; SHOWS.push(s); }); }
const RK = 0.85;
function showShape(type, i, n, bi){
  const h = hash(bi * 100 + i), a = TAU * i / n + hash(bi * 7 + i) * 0.25;

function drawShows(t){
  SHOWS.forEach(([st, cx, cy, R, type, c1, c2, noRocket], bi) => {
    const rp = (t - (st - RK)) / RK;

      const [hx, hy] = pos(rp); glow(hx, hy, 18, 1, [255, 255, 235]);
    }
    const age = t - st, dur = type === 'willow' ? 3.4 : 2.6; if (age < 0 || age > dur) return;
    const u = age / dur, n = type === 'peony' || type === 'ring' ? 80 : 96, grav = type === 'willow' ? 230 : 70;
    for (let i = 0; i < n; i++){
      const [tx, ty] = showShape(type, i, n, bi), e = k => 1 - Math.pow(1 - clamp(k * 1.12), 3);
      const x = cx + tx * R * e(u), y = cy + ty * R * e(u) + grav * u * u, u2 = Math.max(0, u - 0.06);
      const x2 = cx + tx * R * e(u2), y2 = cy + ty * R * e(u2) + grav * u2 * u2;

      const fade = Math.max(0, 1 - Math.pow(u, type === 'willow' ? 1.1 : 1.6)); let fl = 0.65 + 0.35 * Math.sin(age * 38 + i * 7);
      if (type === 'crackle' && u > 0.45) { fl = Math.sin(age * 90 + i * 13) > 0.2 ? 1.4 : 0; col = WHITE; }
      ctx.globalAlpha = fade * 0.6; ctx.strokeStyle = `rgb(${col.map(Math.round)})`; ctx.lineWidth = type === 'willow' ? 2.8 : 2.2;
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x, y); ctx.stroke(); glow(x, y, 10, fade * fl, col);
    }
    glow(cx, cy, 130 * Math.max(0, 1 - u * 4), Math.max(0, 1 - u * 4), c1); glow(cx, cy, 480, 0.30 * Math.exp(-age * 4.5), c1);
  });
}
function shakeAt(t){

  SHOWS.forEach(([st]) => { const a = t - st; if (a > 0 && a < 1){ x += Math.sin(a * 70) * 3.5 * Math.exp(-a * 9); y += Math.cos(a * 83) * 3.5 * Math.exp(-a * 9); } });
  return [x, y];
}
const BAKED = [[100, 115], [222, 165], [1430, 175], [1330, 245]];
function drawBakedPulse(t){

// ============ 7. FOUNTAINS, SPARKLERS, DIYAS ============
function drawFountain(t, bx, by){
  const k = ss((t - (T_LIGHTS + 0.15)) / 0.5); if (k <= 0) return;

function drawSparkler(t, sx, sy, seed){

const DIYAS = [[318, 1843, 1], [523, 1862, 1], [1033, 1862, 1], [1282, 1850, 1], [783, 1788, 1.5], [858, 1838, .9], [710, 1838, .9]];

}

// ============ 8. LANTERNS, STARS, EMBERS, GLINTS, SWEEPS ============
const LANT = [[70, 980, .7], [170, 860, 1], [290, 1000, .6], [1280, 940, .8], [1390, 840, 1.05], [1500, 990, .65], [1560, 800, .8], [120, 760, .6]];

const STARS = [[127, 340, 16], [283, 440, 22], [104, 485, 14], [15, 555, 20], [140, 638, 18], [1526, 440, 14], [1370, 543, 22], [1548, 586, 16], [1513, 740, 18],

const STARS_X = [];
for (let i = 0; i < 16; i++) STARS_X.push([60 + 1480 * hash(i + 400), -330 + 300 * hash(i + 450), 9 + 12 * hash(i + 500)]);

    const x = hash(i + 3) * W + Math.sin(TAU * (age * 3 + hash(i))) * 35, y = (F916 ? 2470 : 1930) - age * (F916 ? 2800 : 1500) * (0.55 + 0.45 * hash(i + 4));

function sweep(t, box, st, dur = 1.1){

// ============ master render ============
function render(t){

  drawLanterns(t); drawShows(t); drawHouseLights(t);

window.render = render; window.T = T;
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
Promise.all([
  load(F916 ? 'poster916.jpg' : 'poster_clean.jpg').then(i => base = i),

    for (const g of Object.values(m)) for (const l of g){ l.img = await load(`layers/${l.name}.png`); LAY[l.name] = l; } })
]).then(() => { window.ready = true; render(6);
  if (!window.__capture){ const t0 = performance.now(); (function loop(){ render(((performance.now() - t0) / 1000) % T); requestAnimationFrame(loop); })(); } });
